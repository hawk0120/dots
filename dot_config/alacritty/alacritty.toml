# Alacritty Configuration (Nord Theme)

[window]
padding = { x = 10, y = 10 }
decorations = "full"

[font]
size = 12.0

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/bin/bash"
args = ["-l"]

[cursor]
style = "Block"
unfocused_hollow = true

[colors.primary]
background = '#2E3440'
foreground = '#D8DEE9'

[colors.normal]
black   = '#3B4252'
red     = '#BF616A'
green   = '#A3BE8C'
yellow  = '#EBCB8B'
blue    = '#81A1C1'
magenta = '#B48EAD'
cyan    = '#88C0D0'
white   = '#E5E9F0'

[colors.bright]
black   = '#4C566A'
red     = '#BF616A'
green   = '#A3BE8C'
yellow  = '#EBCB8B'
blue    = '#81A1C1'
magenta = '#B48EAD'
cyan    = '#8FBCBB'
white   = '#ECEFF4'

[colors.dim]
black   = '#2E3440'
red     = '#BF616A'
green   = '#A3BE8C'
yellow  = '#EBCB8B'
blue    = '#81A1C1'
magenta = '#B48EAD'
cyan    = '#88C0D0'
white   = '#D8DEE9'
